# Icona "Home" sul Desktop: NON usiamo DesktopShortcuts=Home di pcmanfm-qt
# (aprirebbe /root e mostrerebbe lo spazio libero dell'overlay live, troppo
# piccolo). L'icona e' Desktop/HOME.desktop Type=Link su QUELO-HOME.
# DesktopShortcuts=Trash: Cestino solo sul Desktop (non nel pannello).
# QuickExec=true: niente dialogo "eseguire?" (A+B con gio metadata::trust).
[Desktop]
DesktopShortcuts=Trash
Wallpaper=/usr/share/quelo-audiomaker/quelo-sfondo-audiomaker.png
WallpaperMode=stretch

[Behavior]
QuickExec=true

# Dischi/partizioni (es. NVMe interno) devono essere VISIBILI in "Gestione
# file" > Dispositivi (richiede udisks2, vedi hooks/0160-quelo-trim.chroot),
# ma senza alcun automount: l'utente vuole montarli lui a mano cliccandoci
# sopra quando serve, non che compaiano/si montino da soli.
[Volume]
MountOnStartup=false
MountRemovable=false
AutoRun=false
