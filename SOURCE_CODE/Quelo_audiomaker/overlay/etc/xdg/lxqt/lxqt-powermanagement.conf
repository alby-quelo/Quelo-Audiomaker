# Quelo Audiomaker — icona batteria/AC nel tray.
# iconType (lxqt-powermanagement):
#   0 = tema icone
#   1 = cerchio (+/-)          ← default upstream, poco chiaro
#   2 = cerchio con percentuale
#   3 = batteria con percentuale e sfondo
#   4 = batteria con percentuale  ← scelta Quelo
[General]
enableBatteryWatcher=true
showIcon=true
iconType=4
useThemeIcons=false
