# Quelo: timeout 2s già da grubcfg (prima del bootloader).
# Il branding post-install imposta distributor con versione + splash e rigenera grub.cfg.
# keep_distributor:false evita di lasciare il backtick os-release di Calamares/Debian.
---
keep_distributor: false
always_use_defaults: true
defaults:
  GRUB_TIMEOUT: 2
  GRUB_TIMEOUT_STYLE: menu
  GRUB_RECORDFAIL_TIMEOUT: 2
