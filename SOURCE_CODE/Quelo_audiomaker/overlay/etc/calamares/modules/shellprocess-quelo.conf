---
# Esegui sul host live così possiamo copiare i choices e usare ${ROOT}.
dontChroot: true
timeout: 600
verbose: true
script:
  - command: "-mkdir -p ${ROOT}/etc"
    timeout: 30
  - command: "-cp -a /etc/quelo-install-choices.yaml ${ROOT}/etc/quelo-install-choices.yaml"
    timeout: 30
  - command: "-cp -a /etc/calamares/quelo-install-choices.yaml ${ROOT}/etc/quelo-install-choices.yaml"
    timeout: 30
  - command: /etc/calamares/scripts/quelo-target-disable-live-only.sh ${ROOT}
    timeout: 120
  - command: /etc/calamares/scripts/quelo-target-adapt-user-paths.sh ${ROOT}
    timeout: 120
  - command: /etc/calamares/scripts/quelo-target-configure-home.sh ${ROOT}
    timeout: 180
  - command: /etc/calamares/scripts/quelo-target-enable-dm.sh ${ROOT}
    timeout: 180
  - command: /etc/calamares/scripts/quelo-target-grub-branding.sh ${ROOT}
    timeout: 180
