---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
# sudo NON è in defaultGroups: la checkbox "Amministratore" lo aggiunge.
# Richiede pacchetto "sudo" installato (crea /etc/sudoers.d).
sudoersGroup:    sudo

# Mostra la checkbox "accesso automatico" (default Calamares 3.4: va esplicitato).
# Default acceso: sull'installato deve partire il desktop senza login manuale.
displayAutologin: true
autologinGroup:  autologin
doAutologin:     true

setRootPassword: true
doReusePassword: true

# Niente controllo qualità/dizionario (libpwquality): solo password non vuota.
# Evita errori tipo "error loading dictionary" che bloccano Avanti.
passwordRequirements:
    nonempty: true
    minLength: 1
    maxLength: -1

allowWeakPasswords: true
allowWeakPasswordsDefault: true

forbiddenLogins:
    - root
