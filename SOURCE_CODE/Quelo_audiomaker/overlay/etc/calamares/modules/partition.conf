# partition.conf Quelo — layout riscritto da quelo-calamares-disk-layout prima di Calamares.
# Default: unica / da 80 GiB (consigliato); EFI e swap gestiti dal modulo stock.
---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    512MiB
    minimumSize:        32MiB
    label:              "EFI"

userSwapChoices:
    - none
    - small
    - suspend
    - file

luksGeneration: luks1
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: false
initialPartitioningChoice: erase
defaultFileSystemType: "ext4"
essentialMounts: [ "live-*", "control", "ventoy" ]

# Sostituito dal wizard layout disco (quelo-calamares-disk-layout).
partitionLayout:
    - name: "root"
      filesystem: "ext4"
      mountPoint: "/"
      size: 80G
      minSize: 40G
