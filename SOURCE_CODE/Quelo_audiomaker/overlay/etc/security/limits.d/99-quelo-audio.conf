# Quelo Audiomaker — limiti realtime / memoria bloccata per DAW (Ardour, REAPER, …)
# Evita l'avviso Ardour su memlock e riduce rischio xrun da paging.
#
# Utenti installati: gruppo «audio» (Calamares defaultGroups).
# Live: anche root (autologin).

@audio   -  rtprio     95
@audio   -  memlock    unlimited
@audio   -  nice       -19

root     -  rtprio     95
root     -  memlock    unlimited
root     -  nice       -19
